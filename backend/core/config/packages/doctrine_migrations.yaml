doctrine_migrations:
    migrations_paths:
        'DoctrineMigrations': '%kernel.project_dir%/migrations'
    connection: migrations
    storage:
        table_storage:
            # Unqualified on purpose: the role core_migrator has search_path "core, public" (infra/postgres/initdb),
            # so the table is created in schema core. A schema-qualified name here is not found by Doctrine's
            # table lookup on PostgreSQL and the table would be created twice.
            table_name: 'doctrine_migration_versions'
    enable_profiler: false
