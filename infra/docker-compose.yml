# Locator local stack. Project name is fixed to "locator" (see infra/.env.example).
# Host ports are bound to 127.0.0.1 and configurable: this PC may share one localhost with other stacks.

name: locator

services:
  postgres:
    build:
      context: ./postgres
    image: locator-postgres:dev
    environment:
      POSTGRES_DB: locator
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/.env}
      CORE_MIGRATOR_PASSWORD: ${CORE_MIGRATOR_PASSWORD:?set CORE_MIGRATOR_PASSWORD in infra/.env}
      CORE_APP_PASSWORD: ${CORE_APP_PASSWORD:?set CORE_APP_PASSWORD in infra/.env}
      DELIVERY_APP_PASSWORD: ${DELIVERY_APP_PASSWORD:?set DELIVERY_APP_PASSWORD in infra/.env}
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "127.0.0.1:${LOCATOR_DB_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d locator"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  # ---- test profile: throw-away database, never shares data with "postgres" ----
  postgres-test:
    profiles: ["test"]
    build:
      context: ./postgres
    image: locator-postgres:dev
    environment:
      POSTGRES_DB: locator
      POSTGRES_PASSWORD: test-superuser
      CORE_MIGRATOR_PASSWORD: test-migrator
      CORE_APP_PASSWORD: test-core-app
      DELIVERY_APP_PASSWORD: test-delivery-app
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d locator"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

volumes:
  pgdata:
